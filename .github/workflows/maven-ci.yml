name: Maven CI

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Test, package, build and publish image
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mall
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15

      redis:
        image: redis:5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v6

      - name: 配置 Java 17 与 Maven 缓存
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 导入 mall 测试数据库
        working-directory: mall-master
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql --protocol=TCP -h 127.0.0.1 -uroot -proot mall < document/sql/mall.sql

      - name: 测试并打包 mall-admin
        working-directory: mall-master
        run: mvn -B -pl mall-admin -am clean verify -DskipTests=false -Ddocker.skip=true

      - name: 构建 mall-admin Docker 镜像
        working-directory: mall-master
        run: |
          docker build \
            --tag ghcr.io/c36264yz/mall-admin:${{ github.sha }} \
            --tag ghcr.io/c36264yz/mall-admin:latest \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            --file document/sh/Dockerfile \
            mall-admin/target

      - name: 确认 Docker 镜像已生成
        run: docker image inspect ghcr.io/c36264yz/mall-admin:${{ github.sha }}

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 推送 Docker 镜像到 GHCR
        run: |
          docker push ghcr.io/c36264yz/mall-admin:${{ github.sha }}
          docker push ghcr.io/c36264yz/mall-admin:latest

      - name: 保存构建出的 Jar
        uses: actions/upload-artifact@v4
        with:
          name: mall-admin-jar
          path: mall-master/mall-admin/target/*.jar
          if-no-files-found: error
